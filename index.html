<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipcast: Find the movie from the clip</title>
    <meta name="description" content="Saw actors in a clip but don't know the movie? Type the names of the actors you recognise and Clipcast instantly finds every movie they appeared in together. Fast, free, no sign-up.">
    <meta name="keywords" content="find movie by actor, actor intersection, movie search, identify movie from clip, what movie are these actors in, imdb search, costar finder, find film by cast">
    <meta name="author" content="Aritra Roy Gosthipaty">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://clipcast.peithonking.com/">

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clipcast.peithonking.com/">
    <meta property="og:title" content="Clipcast: Find the movie from the clip">
    <meta property="og:description" content="Saw actors in a clip but don't know the movie? Type their names. Clipcast instantly finds every movie they appeared in together. No server. No sign-up.">
    <meta property="og:image" content="https://cv.peithonking.com/images/icon.svg">
    <meta property="og:site_name" content="Clipcast">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://clipcast.peithonking.com/">
    <meta name="twitter:title" content="Clipcast: Find the movie from the clip">
    <meta name="twitter:description" content="Saw actors in a clip but don't know the movie? Type their names. Clipcast instantly finds every movie they appeared in together.">
    <meta name="twitter:image" content="https://cv.peithonking.com/images/icon.svg">

    <!-- Schema.org JSON-LD (Google Rich Results) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Clipcast",
        "url": "https://clipcast.peithonking.com/",
        "description": "Find movies by typing the names of the actors you recognise from a clip. Clipcast shows every movie they appeared in together using a fully client-side DuckDB-Wasm engine.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "author": {
            "@type": "Person",
            "name": "Aritra Roy Gosthipaty",
            "url": "https://cv.peithonking.com"
        }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="https://cv.peithonking.com/images/icon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Clipcast</h1>
            <p class="tagline">Saw a clip, don't know the movie?<br>Type the actors you recognise and we'll find it.</p>
            <p id="statusText" class="status">Loading Engine...</p>
        </header>

        <main>
            <div class="search-container">
                <div id="chipsContainer" class="chips-container"></div>
                
                <div class="input-wrapper">
                    <input type="text" id="searchBox" placeholder="Type an actor's name or IMDb ID..." disabled autocomplete="off" spellcheck="false">
                    <div id="searchSpinner" class="spinner"></div>
                    <div id="autocompleteList" class="autocomplete-list"></div>
                </div>
            </div>

            <div id="movieResults" class="results-container">
                <div class="empty-state">Add two or more actors above to find their shared movies.</div>
            </div>
        </main>

        <footer>
            <p>Made with ♥ by <a href="https://cv.peithonking.com" target="_blank">PeithonKing</a> &bull; <a href="https://github.com/PeithonKing/clipcast" target="_blank">GitHub</a></p>
            <p>Powered by <a href="https://duckdb.org/docs/api/wasm/overview" target="_blank">DuckDB-Wasm</a> &bull; Data from <a href="https://developer.imdb.com/non-commercial-datasets/" target="_blank">IMDb Non-Commercial Datasets</a></p>
        </footer>
    </div>

    <!-- Load the app as a module so we can use top-level imports -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
