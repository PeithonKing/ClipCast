name: Update IMDb Data & Deploy

on:
  # Allow manual trigger via GitHub UI
  workflow_dispatch:
  # Automatically run on push to main branch
  push:
    branches:
      - main
  # Automatically run on the 1st of every month to keep data fresh
  schedule:
    - cron: '0 0 1 * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download IMDb Datasets
        run: |
          echo "Downloading latest IMDb datasets..."
          wget -q -c https://datasets.imdbws.com/name.basics.tsv.gz
          wget -q -c https://datasets.imdbws.com/title.basics.tsv.gz
          wget -q -c https://datasets.imdbws.com/title.principals.tsv.gz

      - name: Generate Parquet Databases
        run: |
          echo "Running DuckDB data pipeline..."
          mkdir -p static/data
          uv run generate_db.py

      - name: Clean up Raw Data
        run: |
          echo "Removing heavy .gz files before uploading to Pages..."
          rm *.tsv.gz

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire directory
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
